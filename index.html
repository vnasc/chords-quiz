<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f2ea">
<title>Chord Quiz — identify progressions by ear</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="shell">
  <div class="layout">
    <main class="main-card" aria-label="Chord progression ear training">
      <section class="play-zone" aria-label="Audio playback">
        <button id="play" class="play-button" type="button" aria-label="Play progression" title="Play progression"><span class="wave" id="wave" aria-hidden="true"></span></button><button class="next-button" id="next" type="button" aria-label="Next progression" title="Next progression" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </section>

      <div class="answer-header"><span class="eyebrow">PROGRESSION</span></div>
      <div class="sequence" id="sequence" aria-label="Your progression"></div>
      <div class="answer-header"><span class="eyebrow">CHORDS</span><button id="play-on-select" class="chord-audio-toggle" type="button" aria-label="Hear selected chord: off" title="Hear selected chord: off" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      <div class="chord-bank" id="choices" role="group" aria-label="Chord choices"></div>
    </main>

    <aside class="side-column" aria-label="Practice settings and progress">
      <section class="side-card" aria-label="Settings">
        <div class="setting">
          <div class="setting-label" id="key-label">Key</div>
          <div class="segmented key-options" id="key" role="group" aria-labelledby="key-label">
            <button type="button" data-value="random" aria-pressed="true" aria-label="Random key" title="Random key">
              <svg class="dice-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m12 2 9 5v10l-9 5-9-5V7l9-5Zm0 10L3 7m9 5 9-5m-9 5v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <g fill="currentColor">
                  <ellipse cx="12" cy="7" rx="1.5" ry="0.85"/>
                  <ellipse cx="6.5" cy="11" rx="0.85" ry="1.2" transform="rotate(-25 6.5 11)"/>
                  <ellipse cx="9" cy="17" rx="0.85" ry="1.2" transform="rotate(-25 9 17)"/>
                  <ellipse cx="18.5" cy="10.5" rx="0.85" ry="1.2" transform="rotate(25 18.5 10.5)"/>
                  <ellipse cx="16.5" cy="14.5" rx="0.85" ry="1.2" transform="rotate(25 16.5 14.5)"/>
                  <ellipse cx="14.5" cy="18.5" rx="0.85" ry="1.2" transform="rotate(25 14.5 18.5)"/>
                </g>
              </svg>
            </button>
            <button type="button" data-value="C" aria-pressed="false">C</button>
            <button type="button" data-value="D" aria-pressed="false">D</button>
            <button type="button" data-value="E" aria-pressed="false">E</button>
            <button type="button" data-value="F" aria-pressed="false">F</button>
            <button type="button" data-value="G" aria-pressed="false">G</button>
            <button type="button" data-value="A" aria-pressed="false">A</button>
            <button type="button" data-value="B" aria-pressed="false">B</button>
          </div>
        </div>

        <div class="setting">
          <div class="setting-label" id="length-label">Length</div>
          <div class="segmented" id="length" role="group" aria-labelledby="length-label">
            <button type="button" data-value="3" aria-pressed="false">3 chords</button>
            <button type="button" data-value="4" aria-pressed="true">4 chords</button>
          </div>
        </div>

        <div class="setting">
          <div class="setting-label" id="speed-label">Playback speed</div>
          <div class="segmented" id="speed" role="group" aria-labelledby="speed-label">
            <button type="button" data-value="slow" aria-pressed="false">Slow</button>
            <button type="button" data-value="normal" aria-pressed="true">Normal</button>
            <button type="button" data-value="fast" aria-pressed="false">Fast</button>
          </div>
        </div>

        <div class="setting">
          <div class="setting-label" id="check-answers-label">Auto-check answer</div>
          <div class="segmented" id="check-answers" role="group" aria-labelledby="check-answers-label">
            <button type="button" data-value="manual" aria-pressed="false" title="Off (press Check)">Off</button>
            <button type="button" data-value="immediate" aria-pressed="true" title="Immediately">Now</button>
            <button type="button" data-value="3" aria-pressed="false" aria-label="After 3 seconds">3 sec</button>
            <button type="button" data-value="5" aria-pressed="false" aria-label="After 5 seconds">5 sec</button>
          </div>
        </div>

        <div class="setting">
          <div class="setting-label" id="auto-next-countdown-label">Auto-next countdown</div>
          <div class="segmented" id="auto-next-countdown" role="group" aria-labelledby="auto-next-countdown-label">
            <button type="button" data-value="0" aria-pressed="false">Off</button>
            <button type="button" data-value="3" aria-pressed="true" aria-label="3 seconds">3 sec</button>
            <button type="button" data-value="5" aria-pressed="false" aria-label="5 seconds">5 sec</button>
          </div>
        </div>
      </section>

      <section class="side-card progress-card"><div class="progress-heading"><h2 class="side-title">Statistics</h2><button id="reset-progress" class="reset-progress" type="button">Reset</button></div><div class="progress-caption"><span>Accuracy</span><strong id="progress-text">— (0/0)</strong></div></section>
    </aside>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
